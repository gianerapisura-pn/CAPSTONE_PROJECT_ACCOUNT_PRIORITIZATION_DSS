
name: PESLC production non-mutating QA

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Non-mutating checks to execute
        type: choice
        default: all
        options:
          - all
          - write-denials

permissions:
  contents: read

jobs:
  browser-smoke:
    name: Authenticated production non-mutating checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out approved repository files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright dependencies
        working-directory: qa
        run: npm install --no-audit --no-fund

      - name: Install Chromium browser
        working-directory: qa
        run: npx playwright install --with-deps chromium

      - name: Run non-mutating browser checks
        working-directory: qa
        env:
          PESLC_WEB_URL: https://peslc-dss-academic-web.vercel.app
          PESLC_QA_EMAIL: ${{ secrets.PESLC_QA_EMAIL }}
          PESLC_QA_PASSWORD: ${{ secrets.PESLC_QA_PASSWORD }}
          PESLC_MANAGEMENT_QA_EMAIL: ${{ secrets.PESLC_MANAGEMENT_QA_EMAIL }}
          PESLC_MANAGEMENT_QA_PASSWORD: ${{ secrets.PESLC_MANAGEMENT_QA_PASSWORD }}
          PESLC_QA_SUITE: ${{ inputs.suite }}
        run: |
          if [ "$PESLC_QA_SUITE" = "write-denials" ]; then
            npx playwright test -c playwright.config.cjs production_denials.spec.cjs
          else
            npx playwright test -c playwright.config.cjs
          fi
