name: PESLC isolated regression QA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Synthetic imports, publication and role checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: progress-future-import-model-monitoring-20261026
          persist-credentials: false   
      - name: Check out QA-only test files
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          path: qa-overlay
          persist-credentials: false

      - name: Copy isolated QA test into development checkout
        run: |
          cp qa-overlay/qa/test_management_mutation_denial_local.py backend/tests/test_management_mutation_denial_local.py
          cp qa-overlay/qa/test_production_probe_safety.py backend/tests/test_production_probe_safety.py
          cp qa-overlay/qa/production_denial_probes.json backend/tests/production_denial_probes.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install checked-in backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Prepare disposable synthetic role-parity publication
        working-directory: backend
        env:
          APP_ENV: test
          DEMO_MODE: 'false'
          SUPABASE_URL: ''
          SUPABASE_SERVICE_ROLE_KEY: ''
          OMP_NUM_THREADS: '1'
          PYTHONPATH: .
        run: python ../qa-overlay/qa/prepare_role_parity_fixture.py "$RUNNER_TEMP/peslc-review.sqlite3"
      - name: Run isolated regression tests
        working-directory: backend
        env:
          APP_ENV: test
          DEMO_MODE: 'false'
          PYTHONWARNINGS: default
          PESLC_QA_REVIEW_DATABASE_PATH: ${{ runner.temp }}/peslc-review.sqlite3
          OMP_NUM_THREADS: '1'
        run: |
          python -m pytest -v --junitxml="$RUNNER_TEMP/backend-regression.xml" \
            tests/test_auth.py \
            tests/test_management_mutation_denial_local.py \
            tests/test_production_probe_safety.py \
            tests/test_import_future.py \
            tests/test_future_publication_integration.py \
            tests/test_import_validation.py \
            tests/test_import_corrections.py \
            tests/test_cli_publication.py \
            tests/test_verified_role_parity.py \
            tests/test_persistence.py
      - name: Save backend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-regression-results
          path: ${{ runner.temp }}/backend-regression.xml
          retention-days: 14

  frontend:
    name: Frontend tests, types and lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: progress-future-import-model-monitoring-20261026
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Repair only the runner's copy of the stale dependency lockfile.
      - name: Reconcile frontend lockfile in the runner
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean frontend installation
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Save regenerated lockfile for a separate reviewed commit
        uses: actions/upload-artifact@v4
        with:
          name: frontend-lockfile-review
          path: frontend/package-lock.json
          retention-days: 14
      - name: Run frontend regression suite
        working-directory: frontend
        run: npm test
      - name: TypeScript check
        working-directory: frontend
        run: npm run typecheck
      - name: Lint check
        working-directory: frontend
        run: npm run lint

  browser:
    name: Synthetic browser import and publication
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: progress-future-import-model-monitoring-20261026
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          path: qa-overlay
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install checked-in backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Install browser runtime
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run existing synthetic browser workflow
        working-directory: frontend
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          NODE_OPTIONS: --max-old-space-size=2048
        run: npx playwright test --config ../qa-overlay/qa/playwright-native.config.ts
      - name: Retain synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-browser-results
          path: ${{ runner.temp }}/peslc-native-browser-results
          retention-days: 14
